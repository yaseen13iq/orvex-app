name: Orvex
options:
  bundleIdPrefix: com.orvex
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ar
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    ORVEX_API: "https://iraqfit.com"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEBUG_INFORMATION_FORMAT: dwarf
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Orvex:
    type: application
    platform: iOS
    sources:
      - path: Orvex
    info:
      path: Orvex/Info.plist
      properties:
        CFBundleDisplayName: أورفيكس
        CFBundleName: ORVEX
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OrvexAPI: $(ORVEX_API)
        LSRequiresIPhoneOS: true
        UIAppFonts: [ReadexPro-Regular.ttf, ReadexPro-Medium.ttf, ReadexPro-SemiBold.ttf, ReadexPro-Bold.ttf, Sora-Regular.ttf, Sora-Medium.ttf, Sora-SemiBold.ttf, Sora-Bold.ttf]
        UILaunchScreen:
          UIColorName: LaunchBG
        NSPhotoLibraryUsageDescription: لاختيار الصور التي ترفعها إلى الموقع
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: com.orvex.admin
            CFBundleURLSchemes: [orvex]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orvex.admin
        PRODUCT_NAME: Orvex
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "IconObsidian IconClassic IconWhite IconMist IconSilver IconSteel IconOutline IconOutlineLight IconBlueprint"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
  OrvexUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OrvexUITests
    dependencies:
      - target: Orvex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orvex.admin.uitests
        TEST_TARGET_NAME: Orvex
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Orvex:
    build:
      targets:
        Orvex: all
        OrvexUITests: [test]
    test:
      targets:
        - OrvexUITests
